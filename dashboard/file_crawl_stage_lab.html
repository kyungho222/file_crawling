<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파일 크롤링 단계 검증</title>
  <style>
    :root { --ink:#192534; --muted:#627184; --line:#d4dee9; --panel:#fff; --bg:#f4f7fa; --blue:#076de8; --danger:#b42318; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.45 Arial,sans-serif; }
    main { max-width:1460px; margin:auto; padding:24px; } header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; } h1,h2 { margin:0; } h1 { font-size:22px; } h2 { font-size:15px; } .muted { color:var(--muted); } .layout { display:grid; grid-template-columns:390px minmax(0,1fr); gap:16px; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; } label { display:block; margin-top:12px; font-weight:600; } input,textarea,select { width:100%; margin-top:5px; border:1px solid #b9c7d6; border-radius:4px; padding:9px; font:14px Arial,sans-serif; } textarea { min-height:72px; resize:vertical; } .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .actions { display:flex; gap:8px; align-items:center; margin-top:16px; } button { border:0; border-radius:4px; background:var(--blue); color:#fff; cursor:pointer; padding:9px 12px; font-weight:700; } button.secondary { color:var(--ink); background:#e7edf4; } button.stop { background:var(--danger); } button:disabled { opacity:.55; cursor:wait; } .jobs { margin-top:16px; border-top:1px solid var(--line); } .job { padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; } .job.selected { background:#eaf3ff; margin:0 -8px; padding:11px 12px; } .job-id { font:12px Consolas,monospace; overflow-wrap:anywhere; } .tag { display:inline-block; padding:2px 6px; border-radius:3px; background:#e8eef5; color:#47586b; font-size:12px; } .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; } .metric { padding:12px; border:1px solid var(--line); border-radius:5px; background:#fff; } .metric span { display:block; color:var(--muted); font-size:12px; } .metric strong { display:block; margin-top:5px; font-size:20px; } .tone-scan { border-color:#b8d5fb; background:#f3f8ff; } .tone-found { border-color:#d8b5f0; background:#fcf6ff; } .tone-state { border-color:#f0cd8f; background:#fffaf0; } .tone-queue { border-color:#a8ddd7; background:#f1fbf9; } .tone-save { border-color:#a9d8b7; background:#f2fbf3; } .tone-learn { border-color:#f2baa5; background:#fff5f1; } .tone-scan strong { color:#075fc4; } .tone-found strong { color:#8a31b7; } .tone-state strong { color:#9a5b00; } .tone-queue strong { color:#08786d; } .tone-save strong { color:#137a36; } .tone-learn strong { color:#b4451f; } button.metric-button { width:100%; color:var(--ink); text-align:left; font:inherit; } button.metric-button:hover, button.metric-button.is-active { border-color:#8a31b7; background:#f8ebff; } table { width:100%; border-collapse:collapse; } th,td { padding:8px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:600; } .result-scroll { max-height:820px; overflow:auto; border:1px solid var(--line); border-radius:4px; } .result-scroll table { min-width:100%; } .result-scroll th { position:sticky; top:0; background:#fff; z-index:1; } .url { word-break:break-all; } pre { max-height:220px; overflow:auto; margin:0; padding:10px; background:#192534; color:#dce8f5; border-radius:4px; white-space:pre-wrap; word-break:break-word; font:12px Consolas,monospace; } .empty { padding:30px; text-align:center; color:var(--muted); } .error { color:var(--danger); margin-top:8px; } #scroll-top { position:fixed; right:24px; bottom:24px; z-index:10; border-radius:50%; width:44px; height:44px; padding:0; font-size:20px; } @media (max-width:900px) { main { padding:12px; } .layout { grid-template-columns:1fr; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } header { flex-direction:column; } #scroll-top { right:16px; bottom:16px; } }
    body { background:#edf2f7; font-family:"Noto Sans KR","Segoe UI",Arial,sans-serif; min-width:320px; }
    main { max-width:1520px; padding:28px; }
    main > header { min-height:78px; padding:2px 2px 18px; border-bottom:1px solid #cbd7e4; }
    main > header p { margin:7px 0 0; }
    #endpoint { padding:6px 9px; border:1px solid #cbd7e4; border-radius:4px; background:#fff; font:12px Consolas,monospace; }
    .layout { align-items:start; }
    .panel { box-shadow:0 1px 2px rgba(33,50,70,.06); border-color:#cbd7e4; }
    aside.panel { position:sticky; top:16px; min-height:610px; }
    label { color:#26384c; line-height:1.35; }
    input, textarea, select { background:#fbfdff; transition:border-color .15s ease, box-shadow .15s ease; }
    input:focus, textarea:focus, select:focus { outline:0; border-color:#076de8; box-shadow:0 0 0 3px rgba(7,109,232,.12); }
    .actions { flex-wrap:wrap; min-height:40px; }
    button { min-height:36px; transition:background .15s ease, border-color .15s ease, transform .15s ease; }
    button:hover:not(:disabled) { background:#075fc4; }
    button:active:not(:disabled) { transform:translateY(1px); }
    button.secondary:hover:not(:disabled) { background:#d8e3ee; }
    .jobs { max-height:500px; overflow:auto; padding-right:3px; }
    .job { border-left:3px solid transparent; padding:11px 9px; transition:background .15s ease, border-color .15s ease; }
    .job:hover { background:#f4f8fc; border-left-color:#8ab9ee; }
    .job.selected { border-left-color:#076de8; box-shadow:inset 0 0 0 1px #c5ddf7; }
    .job-id { color:#3c5269; }
    .tag { border:1px solid #cedae6; }
    .summary { grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); grid-auto-rows:122px; gap:12px; align-items:stretch; }
    .metric { height:122px; min-height:0; overflow:auto; box-shadow:0 1px 1px rgba(31,52,73,.03); scrollbar-width:thin; }
    .metric strong { line-height:1.3; overflow-wrap:anywhere; }
    .metric small { display:block; margin-top:5px; line-height:1.45; overflow-wrap:anywhere; }
    .metric-button { height:122px; }
    .result-scroll { background:#fff; box-shadow:inset 0 1px 0 rgba(15,37,59,.03); overscroll-behavior:contain; }
    .stage-result-scroll { height:460px; max-height:none; }
    .attachment-result-scroll { height:460px; max-height:none; }
    .worker-occupancy-scroll { height:860px; max-height:none; }
    .result-scroll table { min-width:860px; font-size:13px; }
    .result-scroll tbody tr:nth-child(even) { background:#f8fbfe; }
    .result-scroll tbody tr:hover { background:#edf6ff; }
    .worker-status { display:block; margin-top:2px; color:#23608d; font-size:12px; font-weight:600; }
    .worker-trace { display:block; margin-top:2px; color:#61788e; font-size:12px; line-height:1.4; overflow-wrap:anywhere; }
    .operational-status { margin:4px 0 12px; color:#31516d; font-size:13px; }
    .operational-status strong { color:#9a5b00; }
    th { background:#f1f6fb; border-bottom:1px solid #c8d6e5; }
    td { line-height:1.55; }
    hr { border:0; border-top:1px dashed #c7d5e3; margin:8px 0; }
    #found-attachments { scroll-margin-top:18px; margin:0 0 18px; }
    #found-attachments h2 { color:#74309a; }
    pre { border:1px solid #2e465e; box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
    .empty { border:1px dashed #bdcad8; border-radius:5px; background:#fbfdff; }
    .error { padding:10px 12px; border:1px solid #f1b8af; border-radius:4px; background:#fff4f2; }
    #scroll-top { box-shadow:0 3px 10px rgba(7,58,117,.24); }
    @media (max-width:900px) { aside.panel { position:static; min-height:0; } #endpoint { max-width:100%; overflow:hidden; text-overflow:ellipsis; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:116px; } .metric,.metric-button { height:116px; } .stage-result-scroll,.attachment-result-scroll { height:360px; } .worker-occupancy-scroll { height:300px; } }
    @media (max-width:560px) { main { padding:14px; } main > header { min-height:0; } .summary { grid-template-columns:1fr; grid-auto-rows:108px; } .metric,.metric-button { height:108px; } .result-scroll table { min-width:720px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>파일 크롤링 단계 검증</h1><p class="muted">1단계는 exploration 목록 조회, 2단계는 상세 URL의 첨부 목록 추출입니다. 다운로드, 저장, 학습은 실행하지 않습니다.</p></div><span id="endpoint" class="muted"></span></header>
    <div class="layout">
      <aside class="panel"><h2>시작 조건</h2>
        <div class="two"><label>DB 이름<input id="db-name" placeholder="예: newvit"></label><label>Chatbot ID<input id="chatbot-id" placeholder="UUID 또는 ID"></label></div>
        <label>LEARN_LIST ID<input id="learn-list-id" inputmode="numeric" placeholder="예: 123"></label>
        <label>운영 파일 크롤링 Job ID<input id="operational-job-id" placeholder="실제 운영 크롤링 job_id"></label>
        <div class="actions"><button id="watch-operational" class="secondary" type="button">운영 진행현황 조회</button><button id="toggle-monitoring" class="secondary" type="button">실시간 조회 중지</button></div>
        <label>입력 이력<select id="input-history"><option value="">저장된 실행 조건 선택</option></select></label>
        <div class="actions"><button id="reset-inputs" class="secondary" type="button">입력 완전 초기화</button><button id="clear-history" class="secondary" type="button">이력 삭제</button></div>
        <div class="actions"><button id="start">목록 조회 시작</button><span id="message" class="muted"></span></div>
        <div class="jobs"><h2>검증 작업</h2><div id="jobs"><div class="empty">조회된 작업이 없습니다.</div></div></div>
      </aside>
      <section class="panel" id="detail"><div class="empty">시작 조건을 입력해 목록 조회를 시작하세요.</div></section>
    </div>
  </main>
  <button id="scroll-top" type="button" title="맨 위로 이동" aria-label="맨 위로 이동">↑</button>
  <script>
    const ROOT = location.pathname.startsWith('/Ai_Pro_filecrawler/') ? '/Ai_Pro_filecrawler' : '';
    const API = `${ROOT}/file-crawl-stage-lab/api`;
    const HISTORY_KEY = 'fileCrawlStageLabHistory';
    const MONITORING_KEY = 'fileCrawlStageLabMonitoringEnabled';
    const HISTORY_LIMIT = 20;
    let selectedJobId = '', operationalJobId = '', eventSource = null, selectionCleared = false, operationalAttachmentFilterOpen = false, operationalSimhashFilterOpen = false;
    // Opening the dashboard must never resume a previous browser session's
    // polling automatically. Monitoring starts only after an explicit action.
    let realtimeMonitoringEnabled = false;
    const REALTIME_POLL_INTERVAL_MS = 3000;
    let realtimePoller = null;
    let refreshInFlight = false;
    let refreshQueued = false;
    let refreshTimer = null;
    const field = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const get = async path => { const response = await fetch(`${API}${path}`, {cache:'no-store'}); if (!response.ok) throw new Error(await response.text()); return response.json(); };
    const post = async (path, body) => { const response = await fetch(`${API}${path}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); if (!response.ok) throw new Error(await response.text()); return response.json(); };
    const statusLabel = value => ({queued:'대기', loading:'조회 중', extracting:'첨부 추출 중', downloading:'다운로드 검증 중', completed:'완료', failed:'실패', stopped:'중지'}[value] || value);
    const stageLabel = value => ({start_url_load:'1단계 · 시작 목록', attachment_extract:'2단계 · 첨부 추출', download_validation:'3단계 · 다운로드 검증'}[value] || value);
    const downloadPhaseLabel = value => ({item_enter:'다운로드 준비', url_resolve:'파일 URL 확인', domain_slot_wait:'도메인 슬롯 대기', domain_queue_deferred:'도메인 재대기', download_path_prepare:'저장 경로 준비', source_page_prewarm:'상세페이지 세션 준비', http_connect:'HTTP 연결 중', http_response_headers_wait:'응답 헤더 대기', http_response_headers_received:'응답 확인', http_response_metadata:'응답 메타데이터 확인', http_response_discard:'응답 폐기·재시도', http_body_stream:'파일 수신 중', large_lane_enqueue_wait:'대용량 큐 이동', progress_queue_enqueue_wait:'저장 단계 전달 대기', playwright_download:'브라우저 다운로드 중'}[value] || (value ? `처리 중 (${value})` : '처리 중'));
    const byteLabel = value => { const bytes=Math.max(0,Number(value)||0); if (bytes<1024) return `${bytes.toLocaleString('ko-KR')} B`; if (bytes<1024*1024) return `${(bytes/1024).toFixed(1)} KB`; return `${(bytes/(1024*1024)).toFixed(2)} MB`; };
    const streamLabel = item => { const expected=Math.max(0,Number(item.expected_bytes)||0), received=Math.max(0,Number(item.bytes_written)||0), bps=Math.max(0,Number(item.current_bps)||0); if (!expected&&!received) return ''; const last=item.last_progress_ago_sec===undefined||item.last_progress_ago_sec===null?'':` · 마지막 바이트 ${Number(item.last_progress_ago_sec).toLocaleString('ko-KR')}초 전`; return `수신 ${byteLabel(received)} / ${expected?byteLabel(expected):'전체 크기 미확인'} · ${byteLabel(bps)}/s${last}`; };
    function inputProfile() { return {db_name:field('db-name').value.trim(),chat_bot_id:field('chatbot-id').value.trim(),learn_list_id:field('learn-list-id').value.trim()}; }
    function readInputHistory() { try { const value=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); return Array.isArray(value)?value:[]; } catch (_) { return []; } }
    function renderInputHistory() { const select=field('input-history'), items=readInputHistory(); select.innerHTML='<option value="">저장된 실행 조건 선택</option>'+items.map((item,index)=>`<option value="${index}">${esc(item.db_name)} · ${esc(item.chat_bot_id)} · LEARN_LIST ${esc(item.learn_list_id||'-')}</option>`).join(''); field('clear-history').disabled=!items.length; }
    function saveInputHistory(profile) { if (!profile.db_name || !profile.chat_bot_id || !profile.learn_list_id) return; const signature=[profile.db_name,profile.chat_bot_id,profile.learn_list_id].join('|'); const next=[{...profile,saved_at:new Date().toISOString()}].concat(readInputHistory().filter(item=>[item.db_name,item.chat_bot_id,item.learn_list_id].join('|')!==signature)).slice(0,HISTORY_LIMIT); localStorage.setItem(HISTORY_KEY,JSON.stringify(next)); renderInputHistory(); }
    function applyInputHistory(index) { const item=readInputHistory()[Number(index)]; if (!item) return; const ids={db_name:'db-name',chat_bot_id:'chatbot-id',learn_list_id:'learn-list-id'}; Object.entries(ids).forEach(([key,id])=>{ field(id).value=item[key]||''; }); field('message').textContent='저장된 실행 조건을 적용했습니다.'; }
    function renderJobs(items) { const target = field('jobs'); if (!items.length) { target.innerHTML='<div class="empty">조회된 작업이 없습니다.</div>'; return; } if ((!selectedJobId || !items.some(item => item.job_id === selectedJobId)) && !selectionCleared) selectJob(items[0].job_id); target.innerHTML=items.map(item => `<div class="job ${item.job_id===selectedJobId?'selected':''}" data-id="${esc(item.job_id)}"><div class="job-id">${esc(item.job_id)}</div><span class="tag">${esc(stageLabel(item.stage))}</span> <span class="tag">${esc(statusLabel(item.status))}</span><div class="muted">${esc(item.db_name)} · ${esc(item.result_count)}건</div></div>`).join(''); target.querySelectorAll('.job').forEach(node => node.addEventListener('click', () => selectJob(node.dataset.id))); }
    function renderDetail(job, data) { const results=data.results||[]; const status=job.status; const isStage2=job.stage==='attachment_extract'; const active=['queued','loading','extracting'].includes(status); const stage2Action=!isStage2&&status==='completed'&&Number(job.result_count||0)>0?'<button id="start-stage2">2단계 첨부 추출 시작</button>':''; const resultTable=isStage2?`<h2>2단계 첨부 추출 결과</h2>${results.length?`<table><thead><tr><th>#</th><th>상세 URL</th><th>첨부</th><th>파일 목록</th></tr></thead><tbody>${results.map(item=>`<tr><td>${item.index}</td><td class="url">${esc(item.url)}</td><td>${Number(item.attachment_count||0)}</td><td>${(item.attachments||[]).map(file=>`<div>${esc(file.name||'-')}<br><span class="muted url">${esc(file.url||'')}</span></div>`).join('<hr>')||'-'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">상세 페이지에 접속하여 첨부파일을 추출하는 중이거나 결과가 없습니다.</div>'}`:`<h2>1단계 시작 목록</h2>${results.length?`<table><thead><tr><th>#</th><th>상세 URL</th><th>type</th></tr></thead><tbody>${results.map(item=>`<tr><td>${item.index}</td><td class="url">${esc(item.url)}</td><td>${esc(item.type)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">목록을 불러오는 중이거나 결과가 없습니다.</div>'}`; const metricLabel=isStage2?'처리 게시물':'시작 URL'; field('detail').innerHTML=`<header><div><h2>${esc(stageLabel(job.stage))}</h2><p class="muted">${esc(job.job_id)} · ${esc(job.db_name)} · ${esc(job.chat_bot_id)} · ${esc(statusLabel(status))}${job.source_job_id?` · 1단계 ${esc(job.source_job_id)}`:''}</p></div><div class="actions">${stage2Action}${active?'<button id="stop" class="stop">중지</button>':''}</div></header><div class="summary"><div class="metric"><span>상태</span><strong>${esc(statusLabel(status))}</strong></div><div class="metric"><span>${metricLabel}</span><strong>${Number(job.result_count||0).toLocaleString('ko-KR')}</strong></div><div class="metric"><span>소요</span><strong>${job.elapsed_ms==null?'-':`${job.elapsed_ms}ms`}</strong></div></div>${job.error?`<p class="error">${esc(job.error)}</p>`:''}${resultTable}<h2 style="margin-top:18px">요청 옵션</h2><pre>${esc(JSON.stringify(job.options||{},null,2))}</pre>`; field('stop')?.addEventListener('click', async () => { await post(`/jobs/${encodeURIComponent(job.job_id)}/stop`, {}); await refresh(); }); field('start-stage2')?.addEventListener('click', async () => { try { const next=await post(`/jobs/${encodeURIComponent(job.job_id)}/attachment-extractions`,{}); selectedJobId=next.job_id; connectEvents(next.job_id); await refresh(); } catch (error) { field('message').textContent=`2단계 시작 실패: ${error.message}`; } }); }
    function renderStageDetail(job, data) {
      const completionText=job.completion_summary?.text||'';
      queueMicrotask(()=>{ if (!completionText) return; const detail=field('detail'); if (detail && !detail.querySelector('.completion-summary')) detail.insertAdjacentHTML('beforeend',`<h2 class="completion-summary" style="margin-top:18px">작업 마무리</h2><pre>${esc(completionText)}</pre>`); });
      const results=data.results||[], status=job.status, isStage2=job.stage==='attachment_extract', isStage3=job.stage==='download_validation';
      const active=['queued','loading','extracting','downloading'].includes(status), target=Number(job.target_count||0), visited=Number(job.result_count||0);
      const stage2Action=!isStage2&&!isStage3&&status==='completed'&&visited>0?'<button id="start-stage2">2단계 첨부 추출 시작</button>':'';
      const stage1Table=results.length?`<div class="result-scroll stage-result-scroll"><table><thead><tr><th>#</th><th>상세 URL</th><th>type</th></tr></thead><tbody>${results.map(item=>`<tr><td>${item.index}</td><td class="url">${esc(item.url)}</td><td>${esc(item.type)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">목록을 불러오는 중이거나 결과가 없습니다.</div>';
      const stage2Table=results.length?`<div class="result-scroll stage-result-scroll"><table><thead><tr><th>#</th><th>상세 URL</th><th>브레드크럼</th><th>첨부</th><th>파일 목록</th></tr></thead><tbody>${results.map(item=>{const breadcrumb=item.breadcrumb||{}; const breadcrumbText=(breadcrumb.tokens||[]).join(' > ')||'-'; const categoryText=[breadcrumb.cate1,breadcrumb.cate2].filter(Boolean).join(' > ')||'-'; return `<tr><td>${item.index}</td><td class="url">${esc(item.url)}</td><td>${esc(breadcrumbText)}<br><span class="muted">분류: ${esc(categoryText)}</span><br><span class="muted">경로: ${esc(breadcrumb.source||'-')}</span></td><td>${Number(item.attachment_count||0)}</td><td>${(item.attachments||[]).map(file=>`<div>${esc(file.name||'-')}<br><span class="muted url">${esc(file.url||'')}</span></div>`).join('<hr>')||'-'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">상세 페이지에 접속하여 첨부파일을 추출하는 중이거나 결과가 없습니다.</div>';

    function updateMonitoringButton() { const button=field('toggle-monitoring'); if (!button) return; button.textContent=realtimeMonitoringEnabled?'실시간 조회 중지':'실시간 조회 시작'; button.classList.toggle('stop', realtimeMonitoringEnabled); }
    function stopRealtimeMonitoring() { realtimeMonitoringEnabled=false; sessionStorage.setItem(MONITORING_KEY, "off"); if (realtimePoller !== null) { clearInterval(realtimePoller); realtimePoller=null; } if (refreshTimer !== null) { clearTimeout(refreshTimer); refreshTimer=null; } refreshQueued=false; eventSource?.close(); eventSource=null; updateMonitoringButton(); field('message').textContent='실시간 조회를 중지했습니다.'; }
    function startRealtimeMonitoring() { realtimeMonitoringEnabled=true; sessionStorage.setItem(MONITORING_KEY, "on"); if (realtimePoller === null) realtimePoller = window.setInterval(() => refresh(), REALTIME_POLL_INTERVAL_MS); updateMonitoringButton(); if (selectedJobId) connectEvents(selectedJobId); refresh(true); }
    function toggleRealtimeMonitoring() { if (realtimeMonitoringEnabled) stopRealtimeMonitoring(); else startRealtimeMonitoring(); }
    function scheduleRefresh(delay = 0) { if (!realtimeMonitoringEnabled) return; if (refreshTimer !== null) return; refreshTimer = window.setTimeout(() => { refreshTimer = null; refresh(); }, Math.max(0, delay)); }
    function connectEvents(jobId) { eventSource?.close(); eventSource=null; if (!realtimeMonitoringEnabled) return; eventSource = new EventSource(`${API}/jobs/${encodeURIComponent(jobId)}/events`); eventSource.addEventListener('terminal', () => { eventSource?.close(); scheduleRefresh(); }); eventSource.addEventListener('stage', () => scheduleRefresh()); eventSource.onerror = () => scheduleRefresh(250); }
    async function selectJob(jobId) { operationalJobId=''; operationalAttachmentFilterOpen=false; operationalSimhashFilterOpen=false; selectionCleared=false; selectedJobId=jobId; connectEvents(jobId); await refresh(true); }
    async function refresh(force=false) { if (!force && !realtimeMonitoringEnabled) return; if (refreshInFlight) { refreshQueued = true; return; } refreshInFlight = true; const targetOperationalJobId = operationalJobId; const targetJobId = selectedJobId; try { const list=await get('/jobs'); renderJobs(list.jobs||[]); if (targetOperationalJobId) { const operation=await get(`/operational-jobs/${encodeURIComponent(targetOperationalJobId)}`); if (operationalJobId === targetOperationalJobId) renderOperationalDetail(operation); return; } if (!targetJobId) return; const job=await get(`/jobs/${encodeURIComponent(targetJobId)}`); const results=await get(`/jobs/${encodeURIComponent(targetJobId)}/results?limit=30000`); if (selectedJobId === targetJobId && !operationalJobId) renderStageDetail(job,results); } catch (error) { if ((targetOperationalJobId && operationalJobId === targetOperationalJobId) || (!targetOperationalJobId && selectedJobId === targetJobId)) field('detail').innerHTML=`<div class="error">조회 실패: ${esc(error.message)}</div>`; } finally { refreshInFlight = false; if (refreshQueued) { refreshQueued = false; scheduleRefresh(); } } }
    async function start() { const payload=inputProfile(); payload.learn_list_id=payload.learn_list_id||null; saveInputHistory({...payload,learn_list_id:payload.learn_list_id||''}); field('message').textContent='조회 요청 중'; field('start').disabled=true; try { const job=await post('/jobs',payload); selectedJobId=job.job_id; selectionCleared=false; field('message').textContent=`작업 생성: ${job.job_id}`; if (!realtimeMonitoringEnabled) startRealtimeMonitoring(); else { connectEvents(job.job_id); await refresh(); } } catch (error) { field('message').textContent=`시작 실패: ${error.message}`; } finally { field('start').disabled=false; } }
    function resetInputs() { ['db-name','chatbot-id','learn-list-id','operational-job-id'].forEach(id=>{ field(id).value=''; }); field('input-history').value=''; selectedJobId=''; operationalJobId=''; operationalAttachmentFilterOpen=false; operationalSimhashFilterOpen=false; selectionCleared=true; eventSource?.close(); eventSource=null; field('detail').innerHTML='<div class="empty">현재 입력과 선택 결과를 초기화했습니다. 저장된 입력 이력은 유지됩니다.</div>'; field('message').textContent='입력을 초기화했습니다. 저장된 이력은 유지됩니다.'; }
    updateMonitoringButton(); field('toggle-monitoring').addEventListener('click',toggleRealtimeMonitoring); field('start').addEventListener('click',start); field('watch-operational').addEventListener('click',async()=>{ const value=field('operational-job-id').value.trim(); if(!value){field('message').textContent='운영 Job ID를 입력하세요.';return;} operationalJobId=value; operationalAttachmentFilterOpen=false; operationalSimhashFilterOpen=false; selectedJobId=''; selectionCleared=true; eventSource?.close(); eventSource=null; field('message').textContent=`운영 작업 조회: ${value}`; await refresh(true); }); field('input-history').addEventListener('change',event=>applyInputHistory(event.target.value)); field('reset-inputs').addEventListener('click',resetInputs); field('clear-history').addEventListener('click',()=>{localStorage.removeItem(HISTORY_KEY);renderInputHistory();field('message').textContent='입력 이력을 삭제했습니다.';}); field('scroll-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'})); field('endpoint').textContent=`${location.origin}${ROOT}/file-crawl-stage-lab`; renderInputHistory(); window.addEventListener('beforeunload',()=>{ eventSource?.close(); if (realtimePoller !== null) clearInterval(realtimePoller); });
  </script>
