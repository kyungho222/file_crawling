<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>기간수집 (로컬)</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:20px;background:#f7f9fc;color:#222}
    .container{max-width:980px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .form-row{display:flex;gap:12px;align-items:center;margin:10px 0}
    .form-row label{width:150px;font-weight:600}
    .form-row input[type=text], .form-row input[type=date], .form-row select{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px}
    .buttons{margin-top:16px;display:flex;gap:8px}
    button{padding:10px 14px;border:none;border-radius:6px;background:#007bff;color:#fff;cursor:pointer}
    button.secondary{background:#6c757d}
    .status-box{margin-top:18px;padding:12px;border-radius:6px;background:#f1f7ff;border:1px solid #e1eeff;display:none}
    .counts{display:flex;gap:16px;margin-top:8px}
    .counts div{background:#fff;padding:8px 12px;border-radius:6px;border:1px solid #e6eef9}
    pre{background:#0b1220;color:#bfe0ff;padding:85px 0px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <div class="container">
    <h2>기간수집 (로컬 프론트)</h2>
    <div class="form-row">
      <label>챗봇 ID</label>
      <input id="chat_bot_id" type="text" value="dev_bot" />
    </div>
    <div class="form-row">
      <label>수집 대상 URL (contents[0])</label>
      <input id="contents" type="text" value="https://www.nowon.kr" placeholder="https://example.com/path" /> https://www.nowon.kr
    </div>
    <div class="form-row">
      <label>수집형태</label>
      <select id="colle">
        <option value="board">게시판</option>
        <option value="file">파일</option>
        <option value="date">뉴스(날짜)</option>
      </select>
    </div>
    <div class="form-row">
      <label>기간</label>
      <input id="startDate" type="date" /> ~ <input id="endDate" type="date" />
    </div>
    <div class="form-row">
      <label>DB 이름</label>
      <input id="db_name" type="text" value="dev_user" />
    </div>
    <div class="buttons">
      <button id="btnExplore">탐색하기 (explore)</button>
      <button id="btnCrawl">크롤링 시작 (start)</button>
      <button id="btnStop" class="secondary">중단 요청</button>
    </div>

    <div id="statusBox" class="status-box">
      <div><strong>작업 ID:</strong> <span id="jobIdText">-</span></div>
      <div style="margin-top:8px" id="statusText">상태: 대기중</div>
      <div class="counts">
        <div>scan: <span id="scan">0</span></div>
        <div>collection: <span id="collection">0</span></div>
        <div>save: <span id="save">0</span></div>
        <div>study: <span id="study">0</span></div>
      </div>
      <h4 style="margin-top:12px">로그</h4>
      <pre id="logArea" style="height:200px;overflow:auto;"></pre>
    </div>
  </div>

  <script>
    // 엔드포인트 설정 (로컬 백엔드에 맞춰 수정)
    const API_PREFIX = "/Ai_Pro_filecrawler"; // FastAPI router prefix used in backend.app
    const SESSION_START_URL = `${API_PREFIX}/backend/session/start`; // crawl_start endpoint
    const SSE_BASE = `${API_PREFIX}/c1/crawl_sse`; // SSE path used in original PHP frontend
    const CLIENT_HEARTBEAT_URL = `${API_PREFIX}/backend/session/heartbeat`;
    const CLIENT_HEARTBEAT_MS = 25000;
    let clientHeartbeatTimer = null;

    function stopClientHeartbeat(){
      if(clientHeartbeatTimer){
        clearInterval(clientHeartbeatTimer);
        clientHeartbeatTimer = null;
      }
    }

    function startClientHeartbeat(db, jobId){
      stopClientHeartbeat();
      if(!db || !jobId) return;
      const tick = async ()=>{
        try{
          const r = await fetch(CLIENT_HEARTBEAT_URL, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({ job_id: jobId, db_name: db })
          });
          const j = await r.json().catch(()=>({}));
          if(!j || !j.ok){
            log('client Redis heartbeat 실패: ' + (j && j.error ? j.error : String(r.status)));
          }
        }catch(e){
          log('client Redis heartbeat 오류: ' + e);
        }
      };
      tick();
      clientHeartbeatTimer = setInterval(tick, CLIENT_HEARTBEAT_MS);
    }

    function generateJobId(){
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
        const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
      });
    }

    function log(msg){
      const a = document.getElementById('logArea');
      const ts = new Date().toLocaleTimeString();
      // Append at the end so logs appear in chronological order (oldest top, newest bottom)
      a.textContent = (a.textContent || "") + `${ts} ${msg}\n`;
      // Auto-scroll to bottom
      a.scrollTop = a.scrollHeight;
    }

    function showStatus(jobId){
      document.getElementById('statusBox').style.display = 'block';
      document.getElementById('jobIdText').textContent = jobId;
      document.getElementById('statusText').textContent = '상태: 실행중';
    }

    function updateCounts(data){
      document.getElementById('scan').textContent = data.total_count || data.scan_count || 0;
      document.getElementById('collection').textContent = data.collection_count || 0;
      document.getElementById('save').textContent = data.save_count || 0;
      document.getElementById('study').textContent = data.study_count || 0;
    }

    let currentEventSource = null;
    function connectSSE(db, jobId){
      stopClientHeartbeat();
      if(currentEventSource){
        try{ currentEventSource.close(); }catch(e){}
      }
      const url = `${SSE_BASE}/${db}/${jobId}`;
      log(`SSE 연결 시도: ${url}`);
      try{
        currentEventSource = new EventSource(url);
      }catch(e){
        log(`EventSource 생성 실패: ${e}`);
        return;
      }
      startClientHeartbeat(db, jobId);
      currentEventSource.onopen = ()=> log("SSE open");
      currentEventSource.onmessage = (ev)=>{
        try{
          const data = JSON.parse(ev.data);
          log("SSE 메시지: " + ev.data);
          updateCounts(data);
          const terminal = data.status === 'error'
            || (data.status && (data.status === 'completed' || data.status === 'cancelled') && data.event === 'workflow_completed');
          if(terminal){
            document.getElementById('statusText').textContent = `상태: ${data.status}`;
            stopClientHeartbeat();
            currentEventSource.close();
          }
        }catch(e){
          log("SSE 파싱 오류: "+ e);
        }
      };
      currentEventSource.onerror = (e)=>{
        log("SSE error");
        stopClientHeartbeat();
        try{ currentEventSource.close(); }catch(e){}
        currentEventSource = null;
      };
    }

    async function postStart(payload){
      log("요청 전송: " + JSON.stringify(payload));
      try{
        const r = await fetch(SESSION_START_URL, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        if(!r.ok){
          const txt = await r.text();
          log(`서버 응답 오류 ${r.status}: ${txt}`);
          throw new Error('Server error');
        }
        const j = await r.json();
        log("서버 응답: " + JSON.stringify(j));
        return j;
      }catch(e){
        log("요청 실패: "+e);
        throw e;
      }
    }

    document.getElementById('btnExplore').addEventListener('click', async ()=>{
      const jobId = generateJobId();
      const payload = {
        job_id: jobId,
        chat_bot_id: document.getElementById('chat_bot_id').value,
        contents: [document.getElementById('contents').value],
        colle: document.getElementById('colle').value,
        db_name: document.getElementById('db_name').value,
        // exploration mode hint
        mode: 'explore',
      };
      showStatus(jobId);
      try{
        await postStart(payload);
        // connect SSE (backend expects /c1/crawl_sse/{db}/{job_id})
        connectSSE(payload.db_name, jobId);
      }catch(e){
        log("탐색 요청 실패");
      }
    });

    document.getElementById('btnCrawl').addEventListener('click', async ()=>{
      const jobId = generateJobId();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const payload = {
        job_id: jobId,
        chat_bot_id: document.getElementById('chat_bot_id').value,
        contents: [document.getElementById('contents').value],
        colle: document.getElementById('colle').value,
        db_name: document.getElementById('db_name').value,
        target_date: [startDate, endDate],
      };
      showStatus(jobId);
      try{
        await postStart(payload);
        connectSSE(payload.db_name, jobId);
      }catch(e){
        log("크롤링 시작 실패");
      }
    });

    document.getElementById('btnStop').addEventListener('click', async ()=>{
      const jobId = document.getElementById('jobIdText').textContent;
      if(!jobId || jobId==='-') return alert('실행중인 작업이 없습니다.');
      const db = document.getElementById('db_name').value;
      const stopUrl = `${API_PREFIX}/c1/crawl_stop/${jobId}`; // example; adjust backend route if different
      log(`중단요청 전송: ${stopUrl}`);
      try{
        const r = await fetch(stopUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({job_id: jobId})});
        const j = await r.json();
        log('중단 응답: '+ JSON.stringify(j));
      }catch(e){
        log('중단 요청 실패: '+e);
      }
    });

    // init dates: default to this month
    window.addEventListener('load', ()=>{
      const end = new Date();
      const start = new Date(end.getFullYear(), end.getMonth(), 1);
      const fmt = (d)=> d.toISOString().slice(0,10);
      document.getElementById('startDate').value = fmt(start);
      document.getElementById('endDate').value = fmt(end);
    });
  </script>
</body>
</html>
