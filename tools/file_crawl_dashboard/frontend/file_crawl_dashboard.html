<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>파일 크롤링 테스트</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#182230;--muted:#64748b;--line:#dce4ee;--teal:#087f75;--teal-soft:#dff7f1;--blue:#2563eb;--warn:#b45309;--danger:#c2410c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Malgun Gothic",Arial,sans-serif}main{max-width:1440px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:18px}h1{margin:0;font-size:25px}h2{margin:0;font-size:15px}.sub{color:var(--muted);margin-top:6px}.badge{border-radius:999px;padding:7px 11px;background:#e7eef9;color:#25436b;font-weight:700}.layout{display:grid;grid-template-columns:420px 1fr;gap:16px}.stack{display:grid;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #1822300b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font:inherit;background:#fff}textarea{min-height:88px;resize:vertical}.toggle{display:flex;align-items:center;gap:8px;font-weight:700}.toggle input{width:17px;height:17px}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mode{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.mode input{width:auto;margin:0 6px 0 0}.mode:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}button{border:0;border-radius:12px;padding:10px 14px;background:var(--teal);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:hover{background:#05645d}button.secondary{background:#eef3f8;color:#1f354d}button.danger{background:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:22px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage div{border-radius:13px;background:#f6f8fb;padding:11px;border:1px solid var(--line);font-weight:800}.stage div.active{background:var(--teal-soft);border-color:var(--teal)}.log{height:370px;overflow:auto;background:#142235;border-radius:15px;padding:12px;color:#d9e7f5;font:12px Consolas,monospace;white-space:pre-wrap}.log .option{color:#9ff0d9}.log .error{color:#fca5a5}.table{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:13px}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f6f8fb;font-size:12px;color:var(--muted)}.url{word-break:break-all}@media(max-width:900px){.layout{grid-template-columns:1fr}.metrics,.stage{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<header><div><h1>파일 크롤링 테스트</h1><div class="sub">f1_dev 서비스 연동 · 단건 및 전체 대상 · 단계별 실행</div></div><span id="job" class="badge">대기 중</span></header>
<div class="layout"><section class="stack"><section class="panel"><h2>연결 및 대상</h2><div class="fields" style="margin-top:14px"><div><label>DB</label><input id="db" placeholder="jongno"></div><div><label>챗봇 ID</label><input id="bot" placeholder="chat_bot_id"></div><div class="wide"><label>단건 상세페이지 URL</label><textarea id="url" placeholder="https://..."></textarea></div><div><label>전체 조회 제한</label><input id="limit" type="number" value="100" min="1" max="5000"></div><div><label>URL 패턴 옵션</label><input id="pattern" placeholder="/bbs/view.do"></div><div><label>시작일 옵션</label><input id="start" type="date"></div><div><label>종료일 옵션</label><input id="end" type="date"></div></div></section>
<section class="panel"><h2>실행 범위</h2><div class="modes" style="margin-top:14px"><label class="mode"><input type="radio" name="scope" value="single" checked>단건</label><label class="mode"><input type="radio" name="scope" value="all">전체 type=post</label></div><h2 style="margin-top:18px">실행 단계</h2><div class="modes" style="margin-top:14px"><label class="mode"><input type="radio" name="stage" value="discover" checked>탐색</label><label class="mode"><input type="radio" name="stage" value="select">탐색 + 선별</label><label class="mode"><input type="radio" name="stage" value="save">탐색 + 선별 + 저장</label><label class="mode"><input type="radio" name="stage" value="learn">탐색 + 선별 + 저장 + 학습</label></div><label class="toggle" style="margin-top:16px"><input id="dry" type="checkbox" checked>Dry-run (저장·학습 미반영)</label></section>
<section class="panel"><div class="actions"><button id="preview">전체 대상 조회</button><button id="run">선택 단계 실행</button><button id="clear" class="secondary">로그 지우기</button></div></section></section>
<section class="stack"><section class="metrics"><div class="metric"><span>탐색</span><strong id="scan">0</strong></div><div class="metric"><span>선별</span><strong id="select">0</strong></div><div class="metric"><span>저장</span><strong id="save">0</strong></div><div class="metric"><span>학습</span><strong id="learn">0</strong></div></section><section class="panel"><h2>단계 상태</h2><div class="stage" style="margin-top:12px"><div id="s-discover">01 탐색</div><div id="s-select">02 선별</div><div id="s-save">03 저장</div><div id="s-learn">04 학습</div></div></section><section class="panel"><h2>대상 미리보기</h2><div id="rows" class="table" style="margin-top:12px">조회된 대상이 없습니다.</div></section><section class="panel"><h2>상세 로그</h2><div id="log" class="log" style="margin-top:12px"></div></section></section></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];const today=()=>new Date().toISOString().slice(0,10);const now=()=>new Date().toLocaleTimeString('ko-KR',{hour12:false});const value=name=>document.querySelector(`input[name="${name}"]:checked`).value;function log(message,data={},kind=''){const el=document.createElement('div');el.className=kind;el.textContent=`${now()} ${message}\n${JSON.stringify(data,null,2)}`;$('log').prepend(el)}function options(){const stage=value('stage'),dry=$('dry').checked,scope=value('scope');const payload={db_name:$('db').value.trim(),chat_bot_id:$('bot').value.trim(),scope,stage,dry_run:dry,url:$('url').value.trim(),limit:Number($('limit').value||100),pattern:$('pattern').value.trim(),target_date:($('start').value?[$('start').value,$('end').value]:[])};payload.enable_db_save=!dry&&['save','learn'].includes(stage);payload.enable_learning=!dry&&stage==='learn';return payload}function mark(stage){['discover','select','save','learn'].forEach(id=>$('s-'+id).classList.toggle('active',id===stage))}function render(){if(!rows.length){$('rows').textContent='조회된 대상이 없습니다.';return}$('rows').innerHTML='<table><thead><tr><th>ID</th><th>URL</th><th>등록일</th></tr></thead><tbody>'+rows.slice(0,100).map(r=>`<tr><td>${r.id||'-'}</td><td class="url">${r.url||''}</td><td>${r.reg_date||r.created_at||'-'}</td></tr>`).join('')+'</tbody></table>'}async function post(path,payload){const r=await fetch('/Ai_Pro_filecrawler'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||r.status);return d}async function preview(){const p=options();if(!p.db_name||!p.chat_bot_id)throw new Error('DB와 챗봇 ID를 입력하세요.');p.exploration_type='post';p.active_only=true;p.include_duplicates=false;p.limit=p.limit;p.method=p.target_date.length===2?'period':'all';log('[선택옵션] 전체 대상 조회',p,'option');const d=await post('/backend/file-dashboard/exploration-posts',p);rows=d.rows||[];$('scan').textContent=d.total||rows.length;render();log('대상 조회 완료',{total:d.total,returned:rows.length},'option')}async function run(){const p=options();if(p.scope==='all')await preview();else if(!p.url)throw new Error('단건 상세페이지 URL을 입력하세요.');const url=p.scope==='single'?p.url:(rows[0]||{}).url;if(!url)throw new Error('실행할 대상이 없습니다.');p.contents_url=url;p.contents=[url];p.job_id='file-test-'+crypto.randomUUID().slice(0,8);$('job').textContent=p.job_id;mark(p.stage);log('[선택옵션] 단계 실행',p,'option');$('select').textContent=p.stage==='discover'?'1':'0';$('save').textContent=p.enable_db_save?'1':'0';$('learn').textContent=p.enable_learning?'1':'0';log('실행 요청 준비',{job_id:p.job_id,stage:p.stage,target:url},'option');const result=await post('/backend/session/start',p);log('작업 시작 응답',result,'option')}['preview','run'].forEach(id=>$(id).addEventListener('click',()=>({preview,run})[id]().catch(e=>log('오류',{error:e.message},'error')));$('clear').onclick=()=>$('log').textContent='';if(!$('end').value)$('end').value=today();log('대기 중',{안내:'선택 옵션은 실행 또는 조회 직전에 상세 로그로 출력됩니다.'},'option');
</script></body></html>
